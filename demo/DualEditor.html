<html lang="en">

<style>
/* ============================ Theme tokens ============================ */
:root {
  --bg: #f2f3f5;
  --bg-elevated: #ffffff;
  --bg-sunken: #e7e9ec;
  --panel: #ffffff;
  --toolbar: #fafbfc;
  --border: #dcdfe4;
  --border-strong: #c4c9d1;
  --text: #1f2329;
  --text-soft: #5b6470;
  --text-faint: #8a929e;
  --accent: #3b6cf0;
  --accent-soft: #e5edff;
  --accent-text: #ffffff;
  --danger: #d9483b;
  --btn-hover: #eef0f3;
  --btn-active: var(--accent-soft);
  --editor-bg: #ffffff;
  --editor-text: #1f2329;
  --sheet-bg: #ffffff;
  --sheet-text: #1a1a1a;
  --workspace-bg: #babec6;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.06);
  --shadow-md: 0 4px 14px rgba(16,24,40,.10);
  --radius: 8px;
  --radius-sm: 6px;
}
html[data-theme="dark"] {
  --bg: #16181d;
  --bg-elevated: #1e2127;
  --bg-sunken: #101216;
  --panel: #1e2127;
  --toolbar: #22262e;
  --border: #333842;
  --border-strong: #414855;
  --text: #e6e9ee;
  --text-soft: #a4adba;
  --text-faint: #737d8c;
  --accent: #5b86f5;
  --accent-soft: #26314e;
  --accent-text: #ffffff;
  --danger: #f0655a;
  --btn-hover: #2b303a;
  --btn-active: var(--accent-soft);
  --editor-bg: #1a1d23;
  --editor-text: #e2e6ec;
  --sheet-bg: #ffffff;
  --sheet-text: #1a1a1a;
  --workspace-bg: #0d0f13;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 20px rgba(0,0,0,.5);
}
/* Page-view "paper" can be inverted in dark mode when requested */
html[data-theme="dark"] .page-view.invert-paper {
  --sheet-bg: #1a1d23;
  --sheet-text: #e2e6ec;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  overflow: hidden;
}
button { font-family: inherit; }

/* ============================ App bar ============================ */
.appbar {
  height: 46px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  position: relative;
  z-index: 30;
}
.appbar .brand {
  font-weight: 700;
  letter-spacing: .2px;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.appbar .brand .dot { color: var(--accent); }
.appbar .spacer { flex: 1; }
.theme-toggle {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 999px;
  overflow: hidden;
  background: var(--bg-sunken);
}
.theme-toggle button {
  border: 0;
  background: transparent;
  color: var(--text-soft);
  padding: 5px 11px;
  cursor: pointer;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background .15s, color .15s;
}
.theme-toggle button.active {
  background: var(--accent);
  color: var(--accent-text);
}

/* ============================ Workspace / panes ============================ */
.workspace {
  height: calc(100% - 46px);
  display: flex;
  align-items: stretch;
  overflow: hidden;
}
.pane {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--panel);
  overflow: hidden;
  position: relative;
}
.splitter {
  flex: 0 0 6px;
  cursor: col-resize;
  background: var(--border);
  position: relative;
  transition: background .15s;
}
.splitter:hover, .splitter.dragging { background: var(--accent); }
.splitter::after {
  content: "";
  position: absolute;
  inset: 0 -4px;
}
.workspace.maximized-A .splitter,
.workspace.maximized-A #paneB { display: none; }
.workspace.maximized-B .splitter,
.workspace.maximized-B #paneA { display: none; }

/* ============================ Toolbar ============================ */
.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  padding: 5px 8px;
  background: var(--toolbar);
  border-bottom: 1px solid var(--border);
  row-gap: 3px;
}
.tb-group { display: inline-flex; align-items: center; gap: 1px; }
.tb-sep {
  width: 1px;
  align-self: stretch;
  background: var(--border);
  margin: 3px 5px;
}
.tb-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-soft);
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: background .12s, color .12s, border-color .12s;
}
.tb-btn svg { width: 17px; height: 17px; }
.tb-btn .glyph { font-size: 15px; line-height: 1; font-weight: 700; }
.tb-btn.glyph-i .glyph { font-style: italic; font-weight: 500; }
.tb-btn.glyph-u .glyph { text-decoration: underline; font-weight: 500; }
.tb-btn.glyph-s .glyph { text-decoration: line-through; font-weight: 500; }
.tb-btn:hover { background: var(--btn-hover); color: var(--text); }
.tb-btn.active { background: var(--btn-active); color: var(--accent); border-color: transparent; }
.tb-btn:disabled { opacity: .4; cursor: default; }
.tb-text {
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-soft);
  height: 30px;
  padding: 0 9px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background .12s, color .12s;
}
.tb-text:hover { background: var(--btn-hover); color: var(--text); }
.tb-text.active { background: var(--btn-active); color: var(--accent); }
.tb-select {
  height: 30px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 0 6px;
  font-size: 12.5px;
  cursor: pointer;
}
.color-wrap { position: relative; width: 30px; height: 30px; }
.color-wrap input[type=color] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
  border: 0;
  padding: 0;
}
.color-wrap .bar { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; }

/* dropdown menu (save-as choices) */
.menu-wrap { position: relative; }
.menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
  padding: 4px;
  min-width: 170px;
  z-index: 40;
  display: none;
}
.menu.open { display: block; }
.menu button {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 7px 9px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
  text-align: left;
}
.menu button:hover { background: var(--btn-hover); }

/* ============================ Pane body ============================ */
.pane-body { flex: 1; display: flex; min-height: 0; position: relative; }
.editor-scroll {
  flex: 1;
  overflow: auto;
  min-width: 0;
  background: var(--editor-bg);
  scroll-behavior: smooth;
}
.editor-scroll.page-mode { background: var(--workspace-bg); }

/* Draft editing surface */
.editor-host { max-width: 820px; margin: 0 auto; padding: 34px 46px 120px; }
.editor-host.hidden { display: none; }

/* ProseMirror doc styling driven by per-doc CSS vars */
.ProseMirror {
  outline: none;
  color: var(--editor-text);
  font-family: var(--doc-body-font, Georgia, serif);
  font-size: var(--doc-font-size, 16px);
  font-weight: var(--doc-body-weight, 400);
  line-height: var(--doc-line-height, 1.6);
  min-height: 60vh;
}
.ProseMirror > * + * { margin-top: var(--doc-para-spacing, 0.75em); }
.ProseMirror p { margin: 0; }
.ProseMirror.indent p { text-indent: var(--doc-indent, 0); }
.ProseMirror h1, .ProseMirror h2, .ProseMirror h3,
.ProseMirror h4, .ProseMirror h5, .ProseMirror h6 {
  font-family: var(--doc-heading-font, Georgia, serif);
  font-weight: var(--doc-heading-weight, 700);
  line-height: 1.25;
  margin: 1.2em 0 .2em;
}
.ProseMirror h1 { font-size: 2em; }
.ProseMirror h2 { font-size: 1.6em; }
.ProseMirror h3 { font-size: 1.3em; }
.ProseMirror h4 { font-size: 1.12em; }
.ProseMirror h5 { font-size: 1em; }
.ProseMirror h6 { font-size: .9em; text-transform: uppercase; letter-spacing: .04em; color: var(--text-soft); }
.ProseMirror a { color: var(--accent); text-decoration: underline; cursor: pointer; }
.ProseMirror blockquote {
  border-left: 3px solid var(--border-strong);
  margin-left: 0;
  padding-left: 1em;
  color: var(--text-soft);
}
.ProseMirror pre {
  background: var(--bg-sunken);
  border-radius: 6px;
  padding: .8em 1em;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: .9em;
  overflow-x: auto;
}
.ProseMirror code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .9em; }
.ProseMirror :not(pre) > code { background: var(--bg-sunken); padding: .1em .35em; border-radius: 4px; }
.ProseMirror hr { border: none; border-top: 2px solid var(--border); margin: 1.4em 0; }
.ProseMirror img { max-width: 100%; height: auto; border-radius: 4px; }
.ProseMirror ul, .ProseMirror ol { padding-left: 1.5em; }
.ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: .2em; }
.ProseMirror ul[data-type="taskList"] li { display: flex; gap: .5em; align-items: flex-start; }
.ProseMirror ul[data-type="taskList"] li > label { margin-top: .2em; }
.ProseMirror ul[data-type="taskList"] p { margin: 0; }
.ProseMirror table {
  border-collapse: collapse;
  width: 100%;
  margin: .6em 0;
  table-layout: fixed;
  overflow: hidden;
}
.ProseMirror th, .ProseMirror td {
  border: 1px solid var(--border-strong);
  padding: 6px 9px;
  vertical-align: top;
  position: relative;
}
.ProseMirror th { background: var(--bg-sunken); font-weight: 600; }
.ProseMirror .selectedCell:after {
  content: ""; position: absolute; inset: 0; background: rgba(59,108,240,.14); pointer-events: none;
}
.ProseMirror .column-resize-handle {
  position: absolute; right: -2px; top: 0; bottom: 0; width: 4px; background: var(--accent); pointer-events: none;
}
.ProseMirror mark { border-radius: 2px; padding: 0 1px; }
.ProseMirror.text-justify-off { }
.ProseMirror ::selection { background: rgba(59,108,240,.25); }

/* ============================ Page layout view ============================ */
.page-view { display: none; padding: 26px 0 60px; }
.page-view.active { display: block; }
.sheet {
  background: var(--sheet-bg);
  color: var(--sheet-text);
  margin: 0 auto 22px;
  box-shadow: 0 2px 10px rgba(0,0,0,.28);
  position: relative;
  overflow: hidden;
}
.sheet .sheet-content {
  font-family: var(--doc-body-font, Georgia, serif);
  font-size: var(--doc-font-size, 16px);
  font-weight: var(--doc-body-weight, 400);
  line-height: var(--doc-line-height, 1.6);
  height: 100%;
  overflow: hidden;
}
.sheet .sheet-content > * + * { margin-top: var(--doc-para-spacing, 0.75em); }
.sheet .page-num {
  position: absolute;
  bottom: 6px;
  right: 12px;
  font-size: 10px;
  color: #9aa1ab;
  font-family: system-ui, sans-serif;
}

/* ============================ Format panel ============================ */
.format-panel {
  width: 288px;
  flex: 0 0 288px;
  border-left: 1px solid var(--border);
  background: var(--bg-elevated);
  overflow-y: auto;
  padding: 12px 14px 40px;
  display: none;
}
.format-panel.open { display: block; }
.fp-section { margin-bottom: 16px; }
.fp-section > h4 {
  margin: 0 0 8px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-faint);
  font-weight: 700;
}
.fp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.fp-row label { font-size: 12.5px; color: var(--text-soft); flex: 0 0 auto; }
.fp-row .ctl { flex: 1; display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.fp-row select, .fp-row input[type=number] {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 5px;
  padding: 5px 6px;
  font-size: 12.5px;
  max-width: 100%;
}
.fp-row input[type=range] { flex: 1; accent-color: var(--accent); }
.fp-val { font-size: 12px; color: var(--text-soft); min-width: 42px; text-align: right; }
.fp-presets { display: flex; gap: 6px; }
.fp-presets button, .seg button {
  flex: 1; border: 1px solid var(--border); background: var(--panel); color: var(--text-soft);
  border-radius: 5px; padding: 5px 4px; font-size: 12px; cursor: pointer;
}
.fp-presets button:hover, .seg button:hover { background: var(--btn-hover); }
.seg { display: flex; gap: 4px; }
.seg button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.margins-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.margins-grid .m-cell { display: flex; align-items: center; gap: 5px; }
.margins-grid .m-cell span { font-size: 11px; color: var(--text-faint); width: 14px; }
.margins-grid input { width: 100%; }
.switch { display: inline-flex; align-items: center; cursor: pointer; }
.switch input { display: none; }
.switch .track {
  width: 34px; height: 19px; background: var(--border-strong); border-radius: 999px; position: relative; transition: background .15s;
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; background: #fff; border-radius: 50%; transition: left .15s;
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { left: 17px; }
.fp-note { font-size: 11px; color: var(--text-faint); line-height: 1.4; margin-top: 4px; }
.font-select option { font-size: 15px; padding: 4px; }

/* ============================ Find & replace ============================ */
.find-panel {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.find-panel.open { display: flex; }
.find-panel input[type=text] {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 5px;
  padding: 5px 8px;
  font-size: 12.5px;
  width: 150px;
}
.find-panel button {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 5px;
  padding: 5px 9px;
  font-size: 12px;
  cursor: pointer;
}
.find-panel button:hover { background: var(--btn-hover); }
.find-panel .find-count { font-size: 12px; color: var(--text-soft); min-width: 60px; }
.find-panel .toggle-case.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.find-panel .spacer { flex: 1; }
.pm-find-highlight { background: rgba(255,213,0,.45); }
.pm-find-current { background: rgba(255,145,0,.75); }

/* ============================ Status bar ============================ */
.statusbar {
  height: 30px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  border-top: 1px solid var(--border);
  background: var(--toolbar);
  font-size: 12px;
  color: var(--text-soft);
}
.statusbar .filename { font-weight: 600; color: var(--text); display: inline-flex; align-items: center; gap: 5px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.statusbar .dirty { color: var(--accent); font-size: 15px; line-height: 1; }
.statusbar .dirty.hidden { display: none; }
.statusbar .spacer { flex: 1; }
.statusbar .count { color: var(--text-faint); }
.statusbar .view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.statusbar .view-toggle button { border: 0; background: transparent; color: var(--text-soft); font-size: 11.5px; padding: 3px 9px; cursor: pointer; }
.statusbar .view-toggle button.active { background: var(--accent); color: var(--accent-text); }

/* ============================ Toast ============================ */
.toast-host { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--text);
  color: var(--bg-elevated);
  padding: 9px 16px;
  border-radius: 999px;
  font-size: 13px;
  box-shadow: var(--shadow-md);
  animation: toastIn .2s ease;
  max-width: 80vw;
}
.toast.warn { background: var(--danger); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* ============================ Modal ============================ */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(10,14,22,.45); z-index: 150;
  display: none; align-items: center; justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow-md); padding: 20px; width: 400px; max-width: 92vw;
}
.modal h3 { margin: 0 0 8px; font-size: 15px; }
.modal p { margin: 0 0 16px; color: var(--text-soft); font-size: 13px; line-height: 1.5; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal .actions button { border-radius: 7px; padding: 8px 14px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); }

<script>
// Surface uncaught module-evaluation / network errors in the boot overlay so a
// CDN failure degrades gracefully instead of hanging on "Loading editor…".
function __showBootError(msg) {
  var boot = document.getElementById('boot');
  if (!boot || boot.style.display === 'none' || boot.classList.contains('error')) return;
  boot.classList.add('error');
  boot.innerHTML = '<div style="font-size:22px">&#9888; Failed to load editor</div>' +
    '<div class="err-detail">DualEditor needs internet access to load the TipTap editor and Google Fonts from a CDN, and works best served from http(s)/localhost. Check your connection and reload.<br><br><code>' +
    String(msg).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</code></div>';
}
addEventListener('error', function (e) { if (e.message) __showBootError(e.message + (e.filename ? ' @ ' + e.filename : '')); });
addEventListener('unhandledrejection', function (e) { __showBootError((e.reason && e.reason.message) || e.reason); });
</script>

/* Confirm / prompt modals (promise-based) */
function confirmModal({ title, message, okLabel = 'OK', danger = false }) {
  return new Promise(resolve => {
    const modal = $('#modal'), back = $('#modalBackdrop');
    modal.innerHTML = '';
    modal.appendChild(el('h3', null, escHtml(title)));
    modal.appendChild(el('p', null, escHtml(message)));
    const actions = el('div', 'actions');
    const cancel = el('button', null, 'Cancel');
    const ok = el('button', 'primary' + (danger ? ' danger' : ''), escHtml(okLabel));
    actions.append(cancel, ok);
    modal.appendChild(actions);
    back.classList.add('open');
    const close = v => { back.classList.remove('open'); resolve(v); };
    cancel.onclick = () => close(false);
    ok.onclick = () => close(true);
    back.onclick = e => { if (e.target === back) close(false); };
    ok.focus();
  });
}
function promptModal({ title, message, value = '', okLabel = 'OK' }) {
  return new Promise(resolve => {
    const modal = $('#modal'), back = $('#modalBackdrop');
    modal.innerHTML = '';
    modal.appendChild(el('h3', null, escHtml(title)));
    if (message) modal.appendChild(el('p', null, escHtml(message)));
    const input = el('input');
    input.type = 'text'; input.value = value;
    modal.appendChild(input);
    const actions = el('div', 'actions');
    const cancel = el('button', null, 'Cancel');
    const ok = el('button', 'primary', escHtml(okLabel));
    actions.append(cancel, ok);
    modal.appendChild(actions);
    back.classList.add('open');
    const close = v => { back.classList.remove('open'); resolve(v); };
    cancel.onclick = () => close(null);
    ok.onclick = () => close(input.value);
    input.onkeydown = e => { if (e.key === 'Enter') close(input.value); if (e.key === 'Escape') close(null); };
    back.onclick = e => { if (e.target === back) close(null); };
    input.focus(); input.select();
  });
}

/* ==================================================================== */
const loadedFontLinks = new Set();
function addFontLink(href, id) {
  if (loadedFontLinks.has(id || href)) return;
  loadedFontLinks.add(id || href);
  const l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = href;
  l.onerror = () => {}; // isolated failure, browser will synthesize
  document.head.appendChild(l);
}
function loadAllFonts() {
  // one bulk request at safe weights (400;700) for the picker + typical use
  const families = FONTS.map(f => `family=${f.name.replace(/ /g, '+')}:wght@400;700`).join('&');
  addFontLink(`https://fonts.googleapis.com/css2?${families}&display=swap`, 'bulk-fonts');
}
function ensureFontWeight(name, weight) {
  if (weight === 400 || weight === 700) return; // covered by bulk
  const id = `fw-${name}-${weight}`;
  addFontLink(`https://fonts.googleapis.com/css2?family=${name.replace(/ /g, '+')}:wght@${weight}&display=swap`, id);
}

        <div class="page-view" data-el="pageView"></div>
      </div>
      <aside class="format-panel" data-el="format"></aside>
    </div>

    <div class="statusbar">
      <span class="filename" data-el="filename"><span data-el="fname">Untitled</span><span class="dirty hidden" data-el="dirty">●</span></span>
      <span class="spacer"></span>
      <span class="count" data-el="count">0 words · 0 characters</span>
      <span class="view-toggle">
        <button data-a="viewDraft" class="active">Draft</button>
        <button data-a="viewPage">Page layout</button>
      </span>
    </div>
  `;
  return root;
}

function buildFormatPanel(container, settings, onChange) {
  const fontOptions = FONTS.map(f =>
    `<option value="${f.name}" style="font-family:${fontStack(f.name)}">${f.name}</option>`).join('');
  container.innerHTML = `
    <div class="fp-section">
      <h4>Fonts</h4>
      <div class="fp-row"><label>Body</label><div class="ctl">
        <select class="font-select" data-s="bodyFont" style="max-width:150px">${fontOptions}</select></div></div>
      <div class="fp-row"><label>Headings</label><div class="ctl">
        <select class="font-select" data-s="headingFont" style="max-width:150px">${fontOptions}</select></div></div>
      <div class="fp-note">Fonts, colors &amp; alignment show here and in HTML/PDF export, but aren't written into <code>.md</code> files (markdown can't express them).</div>
    </div>

    <div class="fp-section">
      <h4>Font properties</h4>
      <div class="fp-row"><label>Base size</label><div class="ctl">
        <input type="range" min="10" max="24" step="1" data-s="fontSize"><span class="fp-val" data-v="fontSize"></span></div></div>
      <div class="fp-row"><label>Body weight</label><div class="ctl">
        <select data-s="bodyWeight"><option value="300">Light 300</option><option value="400">Regular 400</option><option value="500">Medium 500</option></select></div></div>
      <div class="fp-row"><label>Heading weight</label><div class="ctl">
        <select data-s="headingWeight"><option value="400">400</option><option value="500">500</option><option value="600">600</option><option value="700">700</option><option value="800">800</option></select></div></div>
    </div>

    <div class="fp-section">
      <h4>Paragraph</h4>
      <div class="fp-row"><label>Line spacing</label><div class="ctl">
        <select data-s="lineHeight"><option value="1">1.0</option><option value="1.15">1.15</option><option value="1.3">1.3</option><option value="1.5">1.5</option><option value="1.75">1.75</option><option value="2">2.0</option></select></div></div>
      <div class="fp-row"><label>Paragraph gap</label><div class="ctl">
        <input type="range" min="0" max="2" step="0.25" data-s="paraSpacing"><span class="fp-val" data-v="paraSpacing"></span></div></div>
      <div class="fp-row"><label>First-line indent</label><div class="ctl">
        <label class="switch"><input type="checkbox" data-s="firstLineIndent"><span class="track"></span></label></div></div>
      <div class="fp-row"><label>Justify text</label><div class="ctl">
        <label class="switch"><input type="checkbox" data-s="justify"><span class="track"></span></label></div></div>
    </div>

    <div class="fp-section">
      <h4>Page setup</h4>
      <div class="fp-row"><label>Page size</label><div class="ctl">
        <select data-s="pageSize"><option>Letter</option><option>A4</option><option>Legal</option></select></div></div>
      <div class="fp-row"><label>Orientation</label><div class="ctl seg" data-s="orientation">
        <button data-val="portrait">Portrait</button><button data-val="landscape">Landscape</button></div></div>
      <div class="fp-row"><label>Margin preset</label></div>
      <div class="fp-presets" data-s="marginPreset">
        <button data-val="Normal">Normal</button><button data-val="Narrow">Narrow</button><button data-val="Wide">Wide</button>
      </div>
      <div style="height:8px"></div>
      <div class="margins-grid">
        <div class="m-cell"><span>T</span><input type="number" min="0.25" max="2" step="0.25" data-s="mTop"></div>
        <div class="m-cell"><span>R</span><input type="number" min="0.25" max="2" step="0.25" data-s="mRight"></div>
        <div class="m-cell"><span>B</span><input type="number" min="0.25" max="2" step="0.25" data-s="mBottom"></div>
        <div class="m-cell"><span>L</span><input type="number" min="0.25" max="2" step="0.25" data-s="mLeft"></div>
      </div>
    </div>
  `;

  function syncFromSettings() {
    container.querySelector('[data-s=bodyFont]').value = settings.bodyFont;
    container.querySelector('[data-s=headingFont]').value = settings.headingFont;
    container.querySelector('[data-s=fontSize]').value = settings.fontSize;
    container.querySelector('[data-v=fontSize]').textContent = settings.fontSize + ' px';
    container.querySelector('[data-s=bodyWeight]').value = settings.bodyWeight;
    container.querySelector('[data-s=headingWeight]').value = settings.headingWeight;
    container.querySelector('[data-s=lineHeight]').value = settings.lineHeight;
    container.querySelector('[data-s=paraSpacing]').value = settings.paraSpacing;
    container.querySelector('[data-v=paraSpacing]').textContent = settings.paraSpacing.toFixed(2) + ' em';
    container.querySelector('[data-s=firstLineIndent]').checked = settings.firstLineIndent;
    container.querySelector('[data-s=justify]').checked = settings.justify;
    container.querySelector('[data-s=pageSize]').value = settings.pageSize;
    container.querySelectorAll('[data-s=orientation] button').forEach(b =>
      b.classList.toggle('active', b.dataset.val === settings.orientation));
    container.querySelector('[data-s=mTop]').value = settings.margins.top;
    container.querySelector('[data-s=mRight]').value = settings.margins.right;
    container.querySelector('[data-s=mBottom]').value = settings.margins.bottom;
    container.querySelector('[data-s=mLeft]').value = settings.margins.left;
  }
  syncFromSettings();

  container.addEventListener('input', e => {
    const s = e.target.dataset.s;
    if (!s) return;
    switch (s) {
      case 'bodyFont': settings.bodyFont = e.target.value; break;
      case 'headingFont': settings.headingFont = e.target.value; break;
      case 'fontSize': settings.fontSize = +e.target.value; container.querySelector('[data-v=fontSize]').textContent = settings.fontSize + ' px'; break;
      case 'bodyWeight': settings.bodyWeight = +e.target.value; break;
      case 'headingWeight': settings.headingWeight = +e.target.value; break;
      case 'lineHeight': settings.lineHeight = +e.target.value; break;
      case 'paraSpacing': settings.paraSpacing = +e.target.value; container.querySelector('[data-v=paraSpacing]').textContent = settings.paraSpacing.toFixed(2) + ' em'; break;
      case 'firstLineIndent': settings.firstLineIndent = e.target.checked; break;
      case 'justify': settings.justify = e.target.checked; break;
      case 'pageSize': settings.pageSize = e.target.value; break;
      case 'mTop': settings.margins.top = +e.target.value; break;
      case 'mRight': settings.margins.right = +e.target.value; break;
      case 'mBottom': settings.margins.bottom = +e.target.value; break;
      case 'mLeft': settings.margins.left = +e.target.value; break;
    }
    onChange();
  });
  container.addEventListener('click', e => {
    const btn = e.target.closest('button[data-val]');
    if (!btn) return;
    const group = btn.parentElement.dataset.s;
    if (group === 'orientation') {
      settings.orientation = btn.dataset.val;
      syncFromSettings(); onChange();
    } else if (group === 'marginPreset') {
      const p = MARGIN_PRESETS[btn.dataset.val];
      settings.margins = { ...p };
      syncFromSettings(); onChange();
    }
  });

  return { syncFromSettings };
}

/* ==================================================================== */
/* Pane controller                                                      */
/* ==================================================================== */
function createPane(id) {
  const root = buildPaneDOM(id);
  const q = sel => root.querySelector(sel);
  const host = q('[data-el=host]');
  const scroll = q('[data-el=scroll]');
  const pageViewEl = q('[data-el=pageView]');
  const formatEl = q('[data-el=format]');
  const findEl = q('[data-el=find]');

  const state = {
    id,
    fileHandle: null,
    fileName: 'Untitled',
    fileKind: 'md',            // md | html | txt
    dirty: false,
    savedToDisk: false,
    settings: DEFAULT_SETTINGS(),
    view: 'draft',
    caseSensitive: false,
    findMatches: [],
    findIndex: -1,
  };

  /* ---- Editor ---- */
  const editor = new Editor({
    element: host,
    extensions: [
      StarterKit.configure({ heading: { levels: [1, 2, 3, 4, 5, 6] } }),
      Underline,
      TextAlign.configure({ types: ['heading', 'paragraph'] }),
      Link.configure({ openOnClick: false, autolink: true }),
      Image.configure({ inline: false, allowBase64: true }),
      Table.configure({ resizable: true }),
      TableRow, TableHeader, TableCell,
      TaskList,
      TaskItem.configure({ nested: true }),
      TextStyle,
      Color,
      FontFamily,
      Highlight.configure({ multicolor: false }),
      CharacterCount,
      Markdown.configure({ html: true, transformPastedText: true, linkify: true }),
    ],
    content: '<p></p>',
    onUpdate: () => { markDirty(true); refreshToolbar(); updateCount(); if (state.view === 'page') schedulePageRebuild(); if (findEl.classList.contains('open')) refreshFind(); },
    onSelectionUpdate: () => refreshToolbar(),
    onCreate: () => { refreshToolbar(); updateCount(); },
  });
  state.editor = editor;

  /* ---- Document styling ---- */
  function applySettings() {
    const s = state.settings;
    const pm = host.querySelector('.ProseMirror');
    ensureFontWeight(s.bodyFont, s.bodyWeight);
    ensureFontWeight(s.headingFont, s.headingWeight);
    const vars = {
      '--doc-body-font': fontStack(s.bodyFont),
      '--doc-heading-font': fontStack(s.headingFont),
      '--doc-font-size': s.fontSize + 'px',
      '--doc-body-weight': s.bodyWeight,
      '--doc-heading-weight': s.headingWeight,
      '--doc-line-height': s.lineHeight,
      '--doc-para-spacing': s.paraSpacing + 'em',
      '--doc-indent': s.firstLineIndent ? '1.6em' : '0',
    };
    for (const el2 of [host, pageViewEl]) {
      for (const [k, v] of Object.entries(vars)) el2.style.setProperty(k, v);
    }
    if (pm) {
      pm.classList.toggle('indent', s.firstLineIndent);
      pm.style.textAlign = s.justify ? 'justify' : '';
    }
    if (state.view === 'page') schedulePageRebuild();
    saveDocSettings();
  }

  function saveDocSettings() {
    if (state.savedToDisk || state.fileName !== 'Untitled') {
      try { localStorage.setItem(LS.docSettings(state.fileName), JSON.stringify(state.settings)); } catch {}
    }
  }
  function loadDocSettings(name) {
    try {
      const raw = localStorage.getItem(LS.docSettings(name));
      if (raw) {
        const parsed = JSON.parse(raw);
        state.settings = Object.assign(DEFAULT_SETTINGS(), parsed, { margins: Object.assign(DEFAULT_SETTINGS().margins, parsed.margins || {}) });
        fmt.syncFromSettings();
      }
    } catch {}
  }

  /* ---- Dirty tracking ---- */
  function markDirty(v) {
    state.dirty = v;
    q('[data-el=dirty]').classList.toggle('hidden', !v);
  }
  function setFileName(name, kind) {
    state.fileName = name;
    if (kind) state.fileKind = kind;
    q('[data-el=fname]').textContent = name;
  }

  /* ---- Word/char count ---- */
  function updateCount() {
    const c = editor.storage.characterCount;
    q('[data-el=count]').textContent = `${c.words()} words · ${c.characters()} characters`;
  }

  /* ---- Toolbar state ---- */
  const toolbar = q('.toolbar');
  function setActive(action, on) {
    const b = toolbar.querySelector(`[data-a=${action}]`);
    if (b) b.classList.toggle('active', on);
  }
  function refreshToolbar() {
    setActive('bold', editor.isActive('bold'));
    setActive('italic', editor.isActive('italic'));
    setActive('underline', editor.isActive('underline'));
    setActive('strike', editor.isActive('strike'));
    setActive('highlight', editor.isActive('highlight'));
    setActive('bulletList', editor.isActive('bulletList'));
    setActive('orderedList', editor.isActive('orderedList'));
    setActive('taskList', editor.isActive('taskList'));
    setActive('blockquote', editor.isActive('blockquote'));
    setActive('codeBlock', editor.isActive('codeBlock'));
    setActive('link', editor.isActive('link'));
    setActive('alignLeft', editor.isActive({ textAlign: 'left' }));
    setActive('alignCenter', editor.isActive({ textAlign: 'center' }));
    setActive('alignRight', editor.isActive({ textAlign: 'right' }));
    setActive('alignJustify', editor.isActive({ textAlign: 'justify' }));
    let level = '0';
    for (let l = 1; l <= 6; l++) if (editor.isActive('heading', { level: l })) level = String(l);
    q('[data-a=heading]').value = level;
    q('[data-a=undo]').disabled = !editor.can().undo();
    q('[data-a=redo]').disabled = !editor.can().redo();
  }

  /* ---- Format panel ---- */
  const fmt = buildFormatPanel(formatEl, state.settings, applySettings);

  /* ==================== File operations ==================== */
  function serializeMarkdown() { return editor.storage.markdown.getMarkdown(); }
  function serializeHTMLBody() { return editor.getHTML(); }

  function kindFromName(name) {
    const n = name.toLowerCase();
    if (n.endsWith('.html') || n.endsWith('.htm')) return 'html';
    if (n.endsWith('.txt')) return 'txt';
    return 'md';
  }

  function loadContent(text, name) {
    const kind = kindFromName(name);
    state.fileKind = kind;
    if (kind === 'html') {
      // strip surrounding document if a full HTML file
      let body = text;
      const m = text.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      if (m) body = m[1];
      editor.commands.setContent(body, false, { preserveWhitespace: false });
    } else {
      // markdown / txt
      editor.commands.setContent(text, false); // tiptap-markdown parses markdown strings
    }
    loadDocSettings(name);
    setFileName(name, kind);
    applySettings();
    markDirty(false);
    updateCount();
    refreshToolbar();
  }

  async function doNew() {
    if (state.dirty && !(await confirmModal({ title: 'Discard changes?', message: `"${state.fileName}" has unsaved changes. Start a new document anyway?`, okLabel: 'Discard', danger: true }))) return;
    editor.commands.clearContent(true);
    editor.commands.setContent('<p></p>');
    state.fileHandle = null;
    state.savedToDisk = false;
    state.settings = DEFAULT_SETTINGS();
    fmt.syncFromSettings();
    setFileName('Untitled', 'md');
    applySettings();
    markDirty(false);
    editor.commands.focus();
  }

  async function doOpen() {
    if (state.dirty && !(await confirmModal({ title: 'Discard changes?', message: `"${state.fileName}" has unsaved changes. Open a different file anyway?`, okLabel: 'Discard', danger: true }))) return;
    if (hasFSA) {
      let handle;
      try {
        [handle] = await window.showOpenFilePicker({
          types: [{ description: 'Documents', accept: { 'text/markdown': ['.md', '.markdown'], 'text/html': ['.html', '.htm'], 'text/plain': ['.txt'] } }],
          excludeAcceptAllOption: false,
        });
      } catch (e) { if (e.name !== 'AbortError') toast('Could not open file', true); return; }
      try {
        const file = await handle.getFile();
        const text = await file.text();
        state.fileHandle = handle;
        state.savedToDisk = true;
        loadContent(text, file.name);
        toast(`Opened ${file.name}`);
      } catch (e) { toast('Could not read file', true); }
    } else {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.md,.markdown,.html,.htm,.txt';
      input.onchange = () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { state.fileHandle = null; state.savedToDisk = true; loadContent(String(reader.result), file.name); toast(`Opened ${file.name} (read-only fallback)`); };
        reader.readAsText(file);
      };
      input.click();
    }
  }

  function buildFileText(kind) {
    if (kind === 'html') return buildStandaloneHTML();
    return serializeMarkdown();
  }

  async function doSave() {
    if (!hasFSA || !state.fileHandle) { return doSaveAs(); }
    try {
      const text = buildFileText(state.fileKind === 'html' ? 'html' : 'md');
      const w = await state.fileHandle.createWritable();
      await w.write(text);
      await w.close();
      state.savedToDisk = true;
      markDirty(false);
      saveDocSettings();
      toast(`Saved ${state.fileName}`);
    } catch (e) {
      if (e.name !== 'AbortError') toast('Save failed: ' + e.message, true);
    }
  }

  async function doSaveAs() {
    if (hasFSA) {
      let handle;
      try {
        handle = await window.showSaveFilePicker({
          suggestedName: state.fileName === 'Untitled' ? 'document.md' : state.fileName,
          types: [
            { description: 'Markdown', accept: { 'text/markdown': ['.md'] } },
            { description: 'HTML', accept: { 'text/html': ['.html'] } },
          ],
        });
      } catch (e) { if (e.name !== 'AbortError') toast('Save cancelled', true); return; }
      const kind = kindFromName(handle.name);
      try {
        const text = buildFileText(kind === 'html' ? 'html' : 'md');
        const w = await handle.createWritable();
        await w.write(text);
        await w.close();
        state.fileHandle = handle;
        state.savedToDisk = true;
        setFileName(handle.name, kind);
        markDirty(false);
        saveDocSettings();
        toast(`Saved ${handle.name}`);
      } catch (e) { if (e.name !== 'AbortError') toast('Save failed: ' + e.message, true); }
    } else {
      // fallback: choose format via prompt, anchor-download
      const name = await promptModal({ title: 'Save As', message: 'Filename (use .md or .html):', value: state.fileName === 'Untitled' ? 'document.md' : state.fileName, okLabel: 'Download' });
      if (!name) return;
      const kind = kindFromName(name);
      const text = buildFileText(kind === 'html' ? 'html' : 'md');
      downloadFile(name, text, kind === 'html' ? 'text/html' : 'text/markdown');
      state.savedToDisk = true;
      setFileName(name, kind);
      markDirty(false);
      toast(`Downloaded ${name}`);
    }
  }

  function downloadFile(name, text, mime) {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ---- Standalone HTML builder (Save-as-html + Export) ---- */
  function buildStandaloneHTML() {
    const s = state.settings;
    const usedFonts = [...new Set([s.bodyFont, s.headingFont])];
    const fontLinks = usedFonts.map(f =>
      `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${f.replace(/ /g, '+')}:wght@${s.bodyWeight};${s.headingWeight};400;700&display=swap">`).join('\n  ');
    const page = PAGE_SIZES[s.pageSize];
    const w = s.orientation === 'landscape' ? page.h : page.w;
    const title = escHtml(state.fileName.replace(/\.[^.]+$/, ''));
    const body = serializeHTMLBody();
    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title}</title>
  ${fontLinks}
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f0f0f0; }
  .doc {
    max-width: ${(w - s.margins.left - s.margins.right)}in;
    margin: 40px auto;
    padding: ${s.margins.top}in ${s.margins.right}in ${s.margins.bottom}in ${s.margins.left}in;
    background: #fff;
    box-shadow: 0 2px 16px rgba(0,0,0,.12);
    font-family: ${fontStack(s.bodyFont)};
    font-size: ${s.fontSize}px;
    font-weight: ${s.bodyWeight};
    line-height: ${s.lineHeight};
    color: #1a1a1a;
    text-align: ${s.justify ? 'justify' : 'left'};
  }
  .doc > * + * { margin-top: ${s.paraSpacing}em; }
  .doc p { margin: 0; ${s.firstLineIndent ? `text-indent: 1.6em;` : ''} }
  .doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6 {
    font-family: ${fontStack(s.headingFont)}; font-weight: ${s.headingWeight}; line-height: 1.25; margin: 1.2em 0 .2em;
  }
  .doc h1 { font-size: 2em; } .doc h2 { font-size: 1.6em; } .doc h3 { font-size: 1.3em; }
  .doc h4 { font-size: 1.12em; } .doc h5 { font-size: 1em; } .doc h6 { font-size: .9em; text-transform: uppercase; letter-spacing:.04em; }
  .doc a { color: #2c5bd6; }
  .doc blockquote { border-left: 3px solid #ccc; margin-left: 0; padding-left: 1em; color: #555; }
  .doc pre { background: #f4f4f6; padding: .8em 1em; border-radius: 6px; overflow-x: auto; font-family: ui-monospace, monospace; }
  .doc code { font-family: ui-monospace, monospace; }
  .doc :not(pre) > code { background: #f0f0f2; padding: .1em .35em; border-radius: 4px; }
  .doc img { max-width: 100%; height: auto; }
  .doc table { border-collapse: collapse; width: 100%; }
  .doc th, .doc td { border: 1px solid #bbb; padding: 6px 9px; }
  .doc th { background: #f2f2f4; }
  .doc hr { border: none; border-top: 2px solid #ddd; margin: 1.4em 0; }
  .doc ul[data-type="taskList"] { list-style: none; padding-left: .2em; }
  .doc ul[data-type="taskList"] li { display: flex; gap: .5em; }
  @page { size: ${s.pageSize} ${s.orientation}; margin: ${s.margins.top}in ${s.margins.right}in ${s.margins.bottom}in ${s.margins.left}in; }
  @media print { body { background: #fff; } .doc { margin: 0; max-width: none; box-shadow: none; padding: 0; } }
</style>
</head>
<body>
<article class="doc">
${body}
</article>
</body>
</html>`;
  }

  async function doExport() {
    const html = buildStandaloneHTML();
    const base = state.fileName.replace(/\.[^.]+$/, '') || 'document';
    if (hasFSA) {
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: base + '.html', types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }] });
        const w = await handle.createWritable(); await w.write(html); await w.close();
        toast(`Exported ${handle.name}`);
      } catch (e) { if (e.name !== 'AbortError') toast('Export failed', true); }
    } else {
      downloadFile(base + '.html', html, 'text/html');
      toast(`Exported ${base}.html`);
    }
  }

  /* ---- Print / PDF (this pane only) ---- */
  function doPrint() {
    const s = state.settings;
    const root = document.getElementById('print-root');
    const usedFonts = [...new Set([s.bodyFont, s.headingFont])];
    // ensure fonts present (already loaded globally); build print markup
    root.innerHTML = `
      <style id="print-style">
        @page { size: ${s.pageSize} ${s.orientation}; margin: ${s.margins.top}in ${s.margins.right}in ${s.margins.bottom}in ${s.margins.left}in; }
        #print-root {
          font-family: ${fontStack(s.bodyFont)};
          font-size: ${s.fontSize}px; font-weight: ${s.bodyWeight};
          line-height: ${s.lineHeight}; color: #000;
          text-align: ${s.justify ? 'justify' : 'left'};
        }
        #print-root .doc > * + * { margin-top: ${s.paraSpacing}em; }
        #print-root p { margin: 0; ${s.firstLineIndent ? 'text-indent:1.6em;' : ''} }
        #print-root h1,#print-root h2,#print-root h3,#print-root h4,#print-root h5,#print-root h6 { font-family: ${fontStack(s.headingFont)}; font-weight: ${s.headingWeight}; line-height:1.25; margin:1.2em 0 .2em; break-after: avoid; }
        #print-root h1{font-size:2em}#print-root h2{font-size:1.6em}#print-root h3{font-size:1.3em}#print-root h4{font-size:1.12em}#print-root h5{font-size:1em}#print-root h6{font-size:.9em;text-transform:uppercase}
        #print-root blockquote{border-left:3px solid #999;margin-left:0;padding-left:1em;color:#333}
        #print-root pre{background:#f4f4f6;padding:.8em 1em;border-radius:6px;font-family:ui-monospace,monospace}
        #print-root code{font-family:ui-monospace,monospace}
        #print-root img{max-width:100%;height:auto}
        #print-root table{border-collapse:collapse;width:100%}
        #print-root th,#print-root td{border:1px solid #999;padding:6px 9px}
        #print-root hr{border:none;border-top:2px solid #999;margin:1.4em 0}
        #print-root ul[data-type="taskList"]{list-style:none;padding-left:.2em}
        #print-root ul[data-type="taskList"] li{display:flex;gap:.5em}
      </style>
      <article class="doc">${serializeHTMLBody()}</article>`;
    const cleanup = () => { root.innerHTML = ''; window.removeEventListener('afterprint', cleanup); };
    window.addEventListener('afterprint', cleanup);
    setTimeout(() => window.print(), 60);
  }

  /* ==================== Page layout view ==================== */
  const schedulePageRebuild = debounce(() => { if (state.view === 'page') buildPageView(); }, 220);

  function pageDims() {
    const s = state.settings;
    const p = PAGE_SIZES[s.pageSize];
    let w = p.w, h = p.h;
    if (s.orientation === 'landscape') { [w, h] = [h, w]; }
    return {
      sheetW: w * PX_PER_IN,
      sheetH: h * PX_PER_IN,
      padT: s.margins.top * PX_PER_IN,
      padR: s.margins.right * PX_PER_IN,
      padB: s.margins.bottom * PX_PER_IN,
      padL: s.margins.left * PX_PER_IN,
      contentW: (w - s.margins.left - s.margins.right) * PX_PER_IN,
      contentH: (h - s.margins.top - s.margins.bottom) * PX_PER_IN,
    };
  }

  function buildPageView() {
    const d = pageDims();
    const html = serializeHTMLBody();
    const source = document.createElement('div');
    source.innerHTML = html;
    const blocks = Array.from(source.children);

    pageViewEl.innerHTML = '';
    // measuring container (mirrors content column)
    const makeSheet = () => {
      const sheet = el('div', 'sheet');
      sheet.style.width = d.sheetW + 'px';
      sheet.style.height = d.sheetH + 'px';
      sheet.style.padding = `${d.padT}px ${d.padR}px ${d.padB}px ${d.padL}px`;
      const content = el('div', 'sheet-content');
      sheet.appendChild(content);
      return { sheet, content };
    };

    let cur = makeSheet();
    pageViewEl.appendChild(cur.sheet);
    let pageCount = 1;

    for (const block of blocks) {
      cur.content.appendChild(block.cloneNode(true));
      if (cur.content.scrollHeight > d.contentH && cur.content.children.length > 1) {
        // overflow: move last block to a new page
        const last = cur.content.lastElementChild;
        cur.content.removeChild(last);
        cur = makeSheet();
        pageViewEl.appendChild(cur.sheet);
        pageCount++;
        cur.content.appendChild(last);
      }
    }
    // page numbers
    Array.from(pageViewEl.querySelectorAll('.sheet')).forEach((sh, i) => {
      const num = el('div', 'page-num', `${i + 1} / ${pageCount}`);
      sh.appendChild(num);
    });
    q('[data-el=count]').dataset.pages = pageCount;
  }

  function setView(v) {
    state.view = v;
    const isPage = v === 'page';
    host.classList.toggle('hidden', isPage);
    pageViewEl.classList.toggle('active', isPage);
    scroll.classList.toggle('page-mode', isPage);
    q('[data-a=viewDraft]').classList.toggle('active', !isPage);
    q('[data-a=viewPage]').classList.toggle('active', isPage);
    if (isPage) buildPageView();
    else editor.commands.focus();
  }

  /* ==================== Find & replace ==================== */
  const findInput = q('[data-el=findInput]');
  const replaceInput = q('[data-el=replaceInput]');

  function computeMatches() {
    const query = findInput.value;
    state.findMatches = [];
    if (!query) { state.findIndex = -1; return; }
    const cs = state.caseSensitive;
    const needle = cs ? query : query.toLowerCase();
    const doc = editor.state.doc;
    doc.descendants((node, pos) => {
      if (!node.isText) return;
      const text = cs ? node.text : node.text.toLowerCase();
      let i = 0;
      while ((i = text.indexOf(needle, i)) !== -1) {
        state.findMatches.push({ from: pos + i, to: pos + i + query.length });
        i += query.length || 1;
      }
    });
    if (state.findIndex >= state.findMatches.length) state.findIndex = state.findMatches.length - 1;
  }
  function refreshFind() {
    computeMatches();
    q('[data-el=findCount]').textContent = `${state.findMatches.length ? state.findIndex + 1 : 0} / ${state.findMatches.length}`;
  }
  function gotoMatch(delta) {
    computeMatches();
    if (!state.findMatches.length) { q('[data-el=findCount]').textContent = '0 / 0'; return; }
    state.findIndex = (state.findIndex + delta + state.findMatches.length) % state.findMatches.length;
    const m = state.findMatches[state.findIndex];
    editor.chain().focus().setTextSelection({ from: m.from, to: m.to }).scrollIntoView().run();
    q('[data-el=findCount]').textContent = `${state.findIndex + 1} / ${state.findMatches.length}`;
  }
  function replaceOne() {
    computeMatches();
    if (!state.findMatches.length) return;
    if (state.findIndex < 0) state.findIndex = 0;
    const m = state.findMatches[state.findIndex];
    editor.chain().focus().insertContentAt({ from: m.from, to: m.to }, replaceInput.value).run();
    setTimeout(() => { refreshFind(); gotoMatch(0); }, 0);
  }
  function replaceAll() {
    computeMatches();
    if (!state.findMatches.length) { toast('No matches'); return; }
    const repl = replaceInput.value;
    const count = state.findMatches.length;
    // replace from last to first to keep positions valid
    let chain = editor.chain().focus();
    for (let i = state.findMatches.length - 1; i >= 0; i--) {
      const m = state.findMatches[i];
      chain = chain.insertContentAt({ from: m.from, to: m.to }, repl);
    }
    chain.run();
    setTimeout(refreshFind, 0);
    toast(`Replaced ${count} match${count === 1 ? '' : 'es'}`);
  }
  function openFind() {
    findEl.classList.add('open');
    findInput.focus(); findInput.select();
    refreshFind();
  }
  function closeFind() { findEl.classList.remove('open'); }

  /* ==================== Toolbar actions ==================== */
  const actions = {
    new: doNew, open: doOpen, save: doSave, saveAs: doSaveAs, export: doExport, print: doPrint,
    undo: () => editor.chain().focus().undo().run(),
    redo: () => editor.chain().focus().redo().run(),
    bold: () => editor.chain().focus().toggleBold().run(),
    italic: () => editor.chain().focus().toggleItalic().run(),
    underline: () => editor.chain().focus().toggleUnderline().run(),
    strike: () => editor.chain().focus().toggleStrike().run(),
    highlight: () => editor.chain().focus().toggleHighlight().run(),
    bulletList: () => editor.chain().focus().toggleBulletList().run(),
    orderedList: () => editor.chain().focus().toggleOrderedList().run(),
    taskList: () => editor.chain().focus().toggleTaskList().run(),
    blockquote: () => editor.chain().focus().toggleBlockquote().run(),
    codeBlock: () => editor.chain().focus().toggleCodeBlock().run(),
    hr: () => editor.chain().focus().setHorizontalRule().run(),
    alignLeft: () => editor.chain().focus().setTextAlign('left').run(),
    alignCenter: () => editor.chain().focus().setTextAlign('center').run(),
    alignRight: () => editor.chain().focus().setTextAlign('right').run(),
    alignJustify: () => editor.chain().focus().setTextAlign('justify').run(),
    link: doLink,
    image: doImage,
    tableInsert: () => editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run(),
    addColBefore: () => editor.chain().focus().addColumnBefore().run(),
    addColAfter: () => editor.chain().focus().addColumnAfter().run(),
    delCol: () => editor.chain().focus().deleteColumn().run(),
    addRowBefore: () => editor.chain().focus().addRowBefore().run(),
    addRowAfter: () => editor.chain().focus().addRowAfter().run(),
    delRow: () => editor.chain().focus().deleteRow().run(),
    toggleHeader: () => editor.chain().focus().toggleHeaderRow().run(),
    delTable: () => editor.chain().focus().deleteTable().run(),
    find: () => { if (findEl.classList.contains('open')) closeFind(); else openFind(); },
    format: () => formatEl.classList.toggle('open'),
    maximize: () => toggleMaximize(id),
    findNext: () => gotoMatch(1),
    findPrev: () => gotoMatch(-1),
    replaceOne, replaceAll,
    toggleCase: () => { state.caseSensitive = !state.caseSensitive; toolbar; findEl.querySelector('[data-a=toggleCase]').classList.toggle('active', state.caseSensitive); refreshFind(); },
    closeFind,
    viewDraft: () => setView('draft'),
    viewPage: () => setView('page'),
  };

  async function doLink() {
    const prev = editor.getAttributes('link').href || '';
    const url = await promptModal({ title: 'Link', message: 'Enter URL (leave blank to remove):', value: prev, okLabel: 'Apply' });
    if (url === null) return;
    if (url === '') editor.chain().focus().unsetLink().run();
    else editor.chain().focus().extendMarkRange('link').setLink({ href: url }).run();
  }
  async function doImage() {
    const choice = await confirmModal({ title: 'Insert image', message: 'Insert from a local file (embedded as data URI)? Choose Cancel to enter a URL instead.', okLabel: 'Choose file' });
    if (choice) {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*';
      input.onchange = () => {
        const f = input.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => editor.chain().focus().setImage({ src: String(r.result), alt: f.name }).run();
        r.readAsDataURL(f);
      };
      input.click();
    } else {
      const url = await promptModal({ title: 'Image URL', message: 'Enter image URL:', okLabel: 'Insert' });
      if (url) editor.chain().focus().setImage({ src: url }).run();
    }
  }

  /* toolbar event wiring */
  toolbar.addEventListener('click', e => {
    const btn = e.target.closest('[data-a]');
    if (!btn) return;
    const a = btn.dataset.a;
    if (a === 'saveMenu' || a === 'tableMenu') {
      const menu = btn.parentElement.querySelector('.menu');
      const wasOpen = menu.classList.contains('open');
      closeAllMenus();
      if (!wasOpen) menu.classList.add('open');
      return;
    }
    if (a === 'color') return; // handled via input
    if (actions[a]) { actions[a](); }
  });
  toolbar.addEventListener('change', e => {
    if (e.target.dataset.a === 'heading') {
      const lvl = +e.target.value;
      if (lvl === 0) editor.chain().focus().setParagraph().run();
      else editor.chain().focus().toggleHeading({ level: lvl }).run();
    }
  });
  const colorInput = q('[data-a=color]');
  colorInput.addEventListener('input', () => editor.chain().focus().setColor(colorInput.value).run());

  // menu items
  root.querySelectorAll('.menu').forEach(menu => {
    menu.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      closeAllMenus();
      if (actions[b.dataset.a]) actions[b.dataset.a]();
    });
  });

  // find panel wiring
  findEl.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    if (actions[b.dataset.a]) actions[b.dataset.a]();
  });
  findInput.addEventListener('input', () => { state.findIndex = -1; refreshFind(); });
  findInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); gotoMatch(e.shiftKey ? -1 : 1); } if (e.key === 'Escape') closeFind(); });
  replaceInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); replaceOne(); } if (e.key === 'Escape') closeFind(); });

  // status bar view toggle
  q('.statusbar').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    if (actions[b.dataset.a]) actions[b.dataset.a]();
  });

  /* keyboard shortcuts scoped to this pane */
  root.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === 's' && e.shiftKey) { e.preventDefault(); doSaveAs(); }
    else if (k === 's') { e.preventDefault(); doSave(); }
    else if (k === 'o') { e.preventDefault(); doOpen(); }
    else if (k === 'n') { e.preventDefault(); doNew(); }
    else if (k === 'p') { e.preventDefault(); doPrint(); }
    else if (k === 'f') { e.preventDefault(); openFind(); }
    // Ctrl+B/I/U handled natively by TipTap
  });

  // track focus for global shortcut routing
  root.addEventListener('focusin', () => { focusedPane = id; });

  /* ---- Autosave / restore ---- */
  function autosaveSnapshot() {
    try {
      const payload = {
        markdown: serializeMarkdown(),
        html: serializeHTMLBody(),
        fileName: state.fileName,
        fileKind: state.fileKind,
        settings: state.settings,
        savedToDisk: state.savedToDisk,
        dirty: state.dirty,
        ts: Date.now(),
      };
      localStorage.setItem(LS.paneAuto(id), JSON.stringify(payload));
    } catch {}
  }
  function restoreFromSnapshot(snap) {
    state.settings = Object.assign(DEFAULT_SETTINGS(), snap.settings || {}, { margins: Object.assign(DEFAULT_SETTINGS().margins, (snap.settings || {}).margins || {}) });
    fmt.syncFromSettings();
    if (snap.fileKind === 'html') editor.commands.setContent(snap.html || '<p></p>', false);
    else editor.commands.setContent(snap.markdown || '', false);
    setFileName(snap.fileName || 'Untitled', snap.fileKind || 'md');
    state.savedToDisk = false; // handle can't be restored across sessions
    applySettings();
    markDirty(true);
    updateCount();
  }

  // initial styling
  applySettings();
  updateCount();

  return {
    state, editor, autosaveSnapshot, restoreFromSnapshot,
    hasContent: () => editor.storage.characterCount.characters() > 0 || serializeMarkdown().trim().length > 0,
    isDirty: () => state.dirty,
    fileName: () => state.fileName,
    closeMenus: closeAllMenus,
    onThemeChange: () => { /* recompute page view (paper stays white) */ if (state.view === 'page') buildPageView(); },
  };
}

function closeAllMenus() { document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); }
document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeAllMenus(); });

/* ==================================================================== */
/* Global: theme, splitter, maximize, autosave                          */
/* ==================================================================== */
let focusedPane = 'A';

function applyTheme(mode) {
  const html = document.documentElement;
  let effective = mode;
  if (mode === 'system') effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  html.setAttribute('data-theme', effective);
  document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('active', b.dataset.themeVal === mode));
  Object.values(panes).forEach(p => p.onThemeChange && p.onThemeChange());
}
function initTheme() {
  const saved = localStorage.getItem(LS.theme) || 'system';
  applyTheme(saved);
  $('#themeToggle').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    localStorage.setItem(LS.theme, b.dataset.themeVal);
    applyTheme(b.dataset.themeVal);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if ((localStorage.getItem(LS.theme) || 'system') === 'system') applyTheme('system');
  });
}

function initSplitter() {
  const splitter = $('#splitter');
  const ws = $('#workspace');
  const a = $('#paneA'), b = $('#paneB');
  let dragging = false;
  splitter.addEventListener('mousedown', e => { dragging = true; splitter.classList.add('dragging'); document.body.style.userSelect = 'none'; e.preventDefault(); });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = ws.getBoundingClientRect();
    let ratio = (e.clientX - rect.left) / rect.width;
    ratio = Math.max(0.15, Math.min(0.85, ratio));
    a.style.flex = `1 1 ${ratio * 100}%`;
    b.style.flex = `1 1 ${(1 - ratio) * 100}%`;
  });
  window.addEventListener('mouseup', () => { if (dragging) { dragging = false; splitter.classList.remove('dragging'); document.body.style.userSelect = ''; } });
  splitter.addEventListener('dblclick', () => { a.style.flex = '1 1 50%'; b.style.flex = '1 1 50%'; });
}

let maximizedPane = null;
function toggleMaximize(id) {
  const ws = $('#workspace');
  ws.classList.remove('maximized-A', 'maximized-B');
  if (maximizedPane === id) { maximizedPane = null; }
  else { maximizedPane = id; ws.classList.add('maximized-' + id); }
  // update button icons
  ['A', 'B'].forEach(pid => {
    const btn = document.querySelector(`#pane${pid} [data-a=maximize]`);
    if (btn) { btn.innerHTML = (maximizedPane === pid) ? ICON.minimize : ICON.maximize; btn.title = (maximizedPane === pid) ? 'Restore split view' : 'Maximize this pane'; }
  });
}

function initAutosave() {
  setInterval(() => { Object.values(panes).forEach(p => p.autosaveSnapshot()); }, 10000);
  window.addEventListener('beforeunload', e => {
    // final snapshot
    Object.values(panes).forEach(p => p.autosaveSnapshot());
    if (Object.values(panes).some(p => p.isDirty())) { e.preventDefault(); e.returnValue = ''; return ''; }
  });
}

async function maybeRestore() {
  for (const id of ['A', 'B']) {
    let snap;
    try { snap = JSON.parse(localStorage.getItem(LS.paneAuto(id)) || 'null'); } catch { snap = null; }
    if (snap && !snap.savedToDisk && snap.dirty && (snap.markdown || '').trim()) {
      const when = new Date(snap.ts).toLocaleString();
      const restore = await confirmModal({
        title: `Restore unsaved work? (Pane ${id})`,
        message: `An autosaved draft "${snap.fileName}" from ${when} was never saved to disk. Restore it into pane ${id}?`,
        okLabel: 'Restore',
      });
      if (restore) { panes[id].restoreFromSnapshot(snap); toast(`Restored draft into pane ${id}`); }
      else { try { localStorage.removeItem(LS.paneAuto(id)); } catch {} }
    }
  }
}

/* ==================================================================== */
/* Boot                                                                 */
/* ==================================================================== */
function seedDemo(pane, title, body) {
  pane.editor.commands.setContent(body, false);
  pane.state.fileName = title;
  document.querySelector(`#pane${pane.state.id} [data-el=fname]`).textContent = title;
  pane.editor.commands.focus('end');
  pane.state.dirty = false;
  document.querySelector(`#pane${pane.state.id} [data-el=dirty]`).classList.add('hidden');
}

try {
  initTheme();
  loadAllFonts();
  panes.A = createPane('A');
  panes.B = createPane('B');
  initSplitter();
  initAutosave();

  // Seed with gentle sample content so the panes aren't empty
  seedDemo(panes.A, 'welcome.md',
    '# Welcome to DualEditor\n\nTwo **independent** documents, side by side. Edit, style, and save each on its own.\n\n- Open a `.md`, `.txt`, or `.html` file\n- Style it in the **Format** panel (fonts, spacing, page setup)\n- Switch to **Page layout** to see real page breaks\n- **Save** writes back to the original file on disk\n\n> Fonts, colors, and alignment show here and export to HTML/PDF, but aren\'t written into `.md` files.');
  seedDemo(panes.B, 'notes.md',
    '## Scratch pad\n\nThis pane is completely separate from the left one.\n\n1. Try a different font\n2. Insert a table or an image\n3. Print just this pane to PDF\n\n- [ ] Nothing here affects the other document\n- [x] Truly dual editing');

  document.getElementById('boot').style.display = 'none';
  maybeRestore();
} catch (err) {
  console.error(err);
  const boot = document.getElementById('boot');
  boot.classList.add('error');
  boot.innerHTML = `<div style="font-size:22px">⚠︎ Failed to load editor</div>
    <div class="err-detail">DualEditor needs internet access to load the TipTap editor and Google Fonts from a CDN. Check your connection and reload.<br><br><code>${escHtml(String(err && err.message || err))}</code></div>`;
}
</script>
